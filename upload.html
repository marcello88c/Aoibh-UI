<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aoibh — Upload Deliverable</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #16161a;
    padding: 2.5rem;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p.subtitle { color: #6b6a66; font-size: 0.9rem; margin: 0 0 2rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], select {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid #e5e4e0;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
    box-sizing: border-box;
    background: #fff;
  }
  .field-hint { font-size: 0.8rem; color: #6b6a66; margin: -1.2rem 0 1.5rem; }
  .dropzone {
    border: 1.5px dashed #d9d3ff;
    background: #faf6ff;
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .dropzone p { margin: 0.5rem 0 0; font-size: 0.85rem; color: #6b6a66; }
  #fileName { font-size: 0.9rem; font-weight: 500; margin-top: 0.5rem; }
  button {
    width: 100%;
    background: #16161a;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.9rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #statusMsg { margin-top: 1rem; font-size: 0.9rem; text-align: center; }
  #statusMsg.success { color: #0a7d4f; }
  #statusMsg.error { color: #c0392b; }
  a.file-link { color: #2a6df5; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Upload Deliverable</h1>
  <p class="subtitle">Internal tool — attaches a file to a project's dashboard.</p>

  <label for="adminSecretInput">Admin secret</label>
  <input type="text" id="adminSecretInput" placeholder="Same secret used to change site mode">

  <label for="briefIdInput">Project (brief) ID</label>
  <input type="text" id="briefIdInput" placeholder="Paste the brief's id from Supabase">

  <label for="kindSelect">Type</label>
  <select id="kindSelect">
    <option value="deliverable">Final deliverable (unlocked when paid in full)</option>
    <option value="preview">Preview image (shown before balance is paid)</option>
  </select>

  <div id="labelField" style="display:none;">
    <label for="labelInput">Preview label</label>
    <input type="text" id="labelInput" placeholder="e.g. Homepage">
    <p class="field-hint" style="margin-top:-1.4rem;">Shown as the tab/caption above this preview on the client's dashboard.</p>
  </div>

  <label>File</label>
  <div class="dropzone" id="dropzone">
    <div>⬆</div>
    <strong>Drag a file here, or click to browse</strong>
    <p id="fileName">No file selected</p>
    <input type="file" id="fileInput" hidden>
  </div>

  <button id="uploadBtn">Upload</button>
  <div id="statusMsg"></div>
</div>

<script>
  const adminSecretInput = document.getElementById('adminSecretInput');
  const briefIdInput = document.getElementById('briefIdInput');
  const kindSelect = document.getElementById('kindSelect');
  const labelField = document.getElementById('labelField');
  const labelInput = document.getElementById('labelInput');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileNameEl = document.getElementById('fileName');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusMsg = document.getElementById('statusMsg');

  let selectedFile = null;

  // Remember the admin secret in this browser only, so it doesn't need
  // retyping on every upload. Never sent anywhere except the
  // x-admin-secret header on our own /api/upload-deliverable calls.
  try {
    const saved = localStorage.getItem('aoibh_admin_secret');
    if (saved) adminSecretInput.value = saved;
  } catch (err) {}

  kindSelect.addEventListener('change', () => {
    labelField.style.display = kindSelect.value === 'preview' ? 'block' : 'none';
  });

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length) {
      selectedFile = e.dataTransfer.files[0];
      fileNameEl.textContent = selectedFile.name;
    }
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      selectedFile = fileInput.files[0];
      fileNameEl.textContent = selectedFile.name;
    }
  });

  uploadBtn.addEventListener('click', async () => {
    const adminSecret = adminSecretInput.value.trim();
    const briefId = briefIdInput.value.trim();
    statusMsg.textContent = '';
    statusMsg.className = '';

    if (!adminSecret) {
      statusMsg.textContent = 'Please enter the admin secret.';
      statusMsg.className = 'error';
      return;
    }
    if (!briefId) {
      statusMsg.textContent = 'Please paste a project (brief) ID.';
      statusMsg.className = 'error';
      return;
    }
    const kind = kindSelect.value;
    const label = labelInput.value.trim();
    if (kind === 'preview' && !label) {
      statusMsg.textContent = 'Please give this preview a label (e.g. "Homepage").';
      statusMsg.className = 'error';
      return;
    }
    if (!selectedFile) {
      statusMsg.textContent = 'Please choose a file first.';
      statusMsg.className = 'error';
      return;
    }

    try {
      localStorage.setItem('aoibh_admin_secret', adminSecret);
    } catch (err) {}

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading…';

    try {
      const formData = new FormData();
      formData.append('briefId', briefId);
      formData.append('kind', kind);
      if (kind === 'preview') formData.append('label', label);
      formData.append('file', selectedFile);

      const res = await fetch('/api/upload-deliverable', {
        method: 'POST',
        headers: { 'x-admin-secret': adminSecret },
        body: formData,
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Upload failed');

      if (kind === 'preview') {
        statusMsg.innerHTML = `Preview "${label}" added. <a class="file-link" href="${data.fileUrl}" target="_blank">View file</a><br><br>It'll show up on the client dashboard automatically once their deposit is paid — no other step needed.`;
      } else {
        statusMsg.innerHTML = `Uploaded successfully. <a class="file-link" href="${data.fileUrl}" target="_blank">View file</a><br><br>Remember: also set that project's status to "delivered" in Supabase for it to show on the client dashboard.`;
      }
      statusMsg.className = 'success';
      selectedFile = null;
      fileNameEl.textContent = 'No file selected';
      fileInput.value = '';
      labelInput.value = '';
    } catch (err) {
      statusMsg.textContent = 'Upload failed: ' + err.message;
      statusMsg.className = 'error';
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload';
    }
  });
</script>
</body>
</html>
